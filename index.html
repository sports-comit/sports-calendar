<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Calendar & Match Highlights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #0a0c12;
      --bg-surface: #141824;
      --bg-card: #1c2233;
      --bg-card-hover: #262e45;
      --border-subtle: #2d354d;
      --text-main: #ffffff;
      --text-muted: #8e9bb0;
      --accent-orange: #db5227;
      --accent-peach: #f9b17a;
      --accent-blue: #023661;
      --live-red: #ef4444;
      --font-en: 'Inter', system-ui, -apple-system, sans-serif;
      --font-ar: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-en);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    html[dir="rtl"] body { font-family: var(--font-ar); }

    /* HEADER */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .moe-logo {
      height: 48px;
      width: auto;
      max-width: 120px;
      object-fit: contain;
    }

    .brand-titles h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-titles p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .live-clock-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: var(--bg-card);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    html[dir="rtl"] .live-clock-badge { align-items: flex-start; }

    .live-clock-badge .time {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-peach);
      font-variant-numeric: tabular-nums;
    }

    .live-clock-badge .date {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .lang-btn {
      background: var(--accent-orange);
      color: #fff;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .lang-btn:hover { opacity: 0.9; }

    /* MATCH TICKER */
    .ticker-container {
      background: #0f131d;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      display: flex;
      align-items: center;
    }

    .ticker-scroll-btn {
      background: rgba(15, 19, 29, 0.9);
      border: none;
      color: var(--text-muted);
      width: 36px;
      height: 100%;
      position: absolute;
      z-index: 10;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ticker-scroll-btn.prev { left: 0; }
    .ticker-scroll-btn.next { right: 0; }
    html[dir="rtl"] .ticker-scroll-btn.prev { left: auto; right: 0; }
    html[dir="rtl"] .ticker-scroll-btn.next { right: auto; left: 0; }

    .ticker-track {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 0.6rem 2.5rem;
      gap: 0.75rem;
      width: 100%;
    }

    .ticker-track::-webkit-scrollbar { display: none; }

    .match-ticker-card {
      flex: 0 0 220px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .match-ticker-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-orange);
    }

    .ticker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .status-badge.live {
      color: var(--live-red);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-badge.live::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--live-red);
      border-radius: 50%;
      display: inline-block;
    }

    .ticker-team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    /* MAIN CONTENT */
    main {
      max-width: 1400px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: var(--accent-orange);
      border-radius: 2px;
      display: inline-block;
    }

    /* CALENDAR */
    .calendar-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .calendar-header h3 { font-size: 1.1rem; font-weight: 700; }

    .cal-nav { display: flex; gap: 0.5rem; }

    .cal-nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-day-header {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0.5rem 0;
    }

    .calendar-cell {
      min-height: 85px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .calendar-cell:hover {
      border-color: var(--accent-orange);
      background: var(--bg-card-hover);
    }

    .calendar-cell.empty {
      background: transparent;
      cursor: default;
      border: none;
    }

    .calendar-cell.has-event { border-color: rgba(219, 82, 39, 0.5); }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cell-num { font-size: 0.8rem; font-weight: 700; }

    .event-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-peach);
    }

    .cell-event-pill {
      background: var(--accent-blue);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 4px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    /* MEDIA & HIGHLIGHTS */
    .highlights-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .all-media-btn {
      background: transparent;
      border: 1px solid var(--accent-orange);
      color: var(--accent-orange);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .highlight-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .highlight-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-peach);
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
      background: #111520;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-badge {
      position: absolute;
      background: rgba(219, 82, 39, 0.9);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .card-tag {
      font-size: 0.7rem;
      color: var(--accent-peach);
      text-transform: uppercase;
      font-weight: 700;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="brand-section">
        <img src="logo.png" alt="Logo" class="moe-logo" id="site-logo" onerror="this.style.display='none'">
        <div class="brand-titles">
          <h1 id="ui-title">Sports Calendar & Match Highlights</h1>
          <p id="ui-subtitle">Physical Education Directorate - Student Sports Teams</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="live-clock-badge">
          <span class="time" id="clock-time">--:--:--</span>
          <span class="date" id="clock-date">--------</span>
        </div>
        <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">العربية</button>
      </div>
    </div>
  </header>

  <!-- MATCH TICKER -->
  <div class="ticker-container">
    <button class="ticker-scroll-btn prev" onclick="scrollTicker(-1)">&#8249;</button>
    <div class="ticker-track" id="tickerTrack">
      <!-- Populated by JS -->
    </div>
    <button class="ticker-scroll-btn next" onclick="scrollTicker(1)">&#8250;</button>
  </div>

  <!-- MAIN CONTENT -->
  <main>
    <!-- CALENDAR SECTION -->
    <section>
      <div class="section-title" id="ui-cal-title">Tournament Schedule</div>
      <div class="calendar-container">
        <div class="calendar-header">
          <h3 id="currentMonthYear">November 2026</h3>
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="prevMonth()">&#8249;</button>
            <button class="cal-nav-btn" onclick="nextMonth()">&#8250;</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarDaysHeaders">
          <!-- Populated by JS -->
        </div>
        <div class="calendar-grid" id="calendarGrid" style="margin-top: 6px;">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- HIGHLIGHTS / MEDIA SECTION -->
    <section>
      <div class="highlights-header">
        <div class="section-title" style="margin-bottom: 0;" id="ui-media-title">Match Highlights & Media</div>
        <button class="all-media-btn" id="ui-view-all">View All Highlights</button>
      </div>
      <div class="highlights-grid" id="highlightsGrid">
        <!-- Populated by JS -->
      </div>
    </section>
  </main>

  <!-- VIDEO MODAL POPUP -->
  <div id="videoModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; padding:20px;" onclick="closeOnBackdrop(event)">
    <div style="position:relative; width:100%; max-width:800px; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;">
      <button onclick="closeVideoModal()" style="position:absolute; top:12px; right:12px; z-index:10; background:rgba(0,0,0,0.7); color:#fff; border:none; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:18px; font-weight:bold;">✕</button>
      <iframe id="videoIframe" src="" style="width:100%; height:100%; border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    let currentLang = 'en';

    const translations = {
      en: {
        dir: 'ltr',
        langBtn: 'العربية',
        title: 'Sports Calendar & Match Highlights',
        subtitle: 'Physical Education Directorate - Student Sports Teams',
        calTitle: 'Tournament Schedule',
        mediaTitle: 'Match Highlights & Media',
        viewAll: 'View All Highlights',
        days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
        monthNames: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
        live: 'LIVE',
        ft: 'FINAL'
      },
      ar: {
        dir: 'rtl',
        langBtn: 'English',
        title: 'جدول الفعاليات والأنشطة الرياضية',
        subtitle: 'إدارة التربية الرياضية - قسم المنتخبات الطلابية',
        calTitle: 'الجدول الزمني للبطولات والمسابقات',
        mediaTitle: 'أبرز لقطات المباريات والوسائط',
        viewAll: 'عرض جميع الفيديوهات',
        days: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'],
        monthNames: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'],
        live: 'مباشر',
        ft: 'انتهت'
      }
    };

    const matches = [
      { sport: 'Football', live: true, team1: 'Riffa Sec', score1: 2, team2: 'Muharraq Sec', score2: 1, minute: '78\'' },
      { sport: 'Volleyball', live: false, team1: 'Isa Town Int', score1: 3, team2: 'Saar Int', score2: 0, status: 'FT' },
      { sport: 'Basketball', live: true, team1: 'Hidd Sec', score1: 54, team2: 'Manama Sec', score2: 58, minute: 'Q4' },
      { sport: 'Football', live: false, team1: 'Budaiya Sec', score1: 0, team2: 'Hamad Town', score2: 2, status: 'FT' }
    ];

    const calendarEvents = {
      '2026-11-04': { title_en: 'Football Semis', title_ar: 'نصف نهائي القدم' },
      '2026-11-10': { title_en: 'Volleyball Final', title_ar: 'نهائي الطائرة' },
      '2026-11-18': { title_en: 'Track & Field Day', title_ar: 'سباق القوى المفتوح' }
    };

    // YouTube IDs configured here
    const highlights = [
      {
        tag_en: 'Football', tag_ar: 'كرة القدم',
        title_en: 'Secondary Schools Championship: Best Goals of Round 1',
        title_ar: 'أجمل أهداف الجولة الأولى لدوري المدارس الثانوية',
        date: '2026-11-01',
        img: 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=600&q=80',
        youtubeId: 'ScMzIvxBSi4'
      },
      {
        tag_en: 'Volleyball', tag_ar: 'الكرة الطائرة',
        title_en: 'Highlights: Thrilling 5-Set Match Between Riffa & Muharraq',
        title_ar: 'ملخص الشوط الحاسم المثير بين فريقي الرفاع والمحرق',
        date: '2026-10-29',
        img: 'https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=600&q=80',
        youtubeId: 'kJQP7kiw5Fk'
      },
      {
        tag_en: 'Athletics', tag_ar: 'ألعاب القوى',
        title_en: '100m Sprint Final: New Student Record Set',
        title_ar: 'رقم قياسي جديد في نهائي سباق 100 متر للمرحلة الإعدادية',
        date: '2026-10-25',
        img: 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=600&q=80',
        youtubeId: 'ScMzIvxBSi4'
      }
    ];

    let currentYear = 2026;
    let currentMonth = 10; // 0-indexed (10 = November)

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-GB');
      document.getElementById('clock-date').textContent = now.toISOString().split('T')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderTicker() {
      const track = document.getElementById('tickerTrack');
      track.innerHTML = '';
      const t = translations[currentLang];

      matches.forEach(m => {
        const card = document.createElement('div');
        card.className = 'match-ticker-card';
        card.innerHTML = `
          <div class="ticker-header">
            <span>${m.sport}</span>
            <span class="status-badge ${m.live ? 'live' : ''}">${m.live ? (t.live + ' ' + m.minute) : t.ft}</span>
          </div>
          <div class="ticker-team-row">
            <span>${m.team1}</span>
            <span>${m.score1}</span>
          </div>
          <div class="ticker-team-row">
            <span>${m.team2}</span>
            <span>${m.score2}</span>
          </div>
        `;
        track.appendChild(card);
      });
    }

    function scrollTicker(direction) {
      const track = document.getElementById('tickerTrack');
      const shift = 230 * direction;
      track.scrollBy({ left: shift, behavior: 'smooth' });
    }

    function renderCalendar() {
      const t = translations[currentLang];
      document.getElementById('currentMonthYear').textContent = `${t.monthNames[currentMonth]} ${currentYear}`;
      
      const dayHeaders = document.getElementById('calendarDaysHeaders');
      dayHeaders.innerHTML = t.days.map(d => `<div class="calendar-day-header">${d}</div>`).join('');

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-cell empty';
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        const mKey = String(currentMonth + 1).padStart(2, '0');
        const dKey = String(day).padStart(2, '0');
        const dateString = `${currentYear}-${mKey}-${dKey}`;
        const ev = calendarEvents[dateString];

        cell.className = `calendar-cell ${ev ? 'has-event' : ''}`;
        cell.innerHTML = `
          <div class="cell-top">
            <span class="cell-num">${day}</span>
            ${ev ? '<div class="event-indicator"></div>' : ''}
          </div>
          ${ev ? `<div class="cell-event-pill">${currentLang === 'ar' ? ev.title_ar : ev.title_en}</div>` : ''}
        `;
        grid.appendChild(cell);
      }
    }

    function renderHighlights() {
      const grid = document.getElementById('highlightsGrid');
      grid.innerHTML = '';
      highlights.forEach(h => {
        const card = document.createElement('div');
        card.className = 'highlight-card';
        card.onclick = () => openVideoModal(h.youtubeId);
        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${h.img}" alt="${h.title_en}">
            <div class="play-badge">&#9658;</div>
          </div>
          <div class="card-content">
            <span class="card-tag">${currentLang === 'ar' ? h.tag_ar : h.tag_en}</span>
            <div class="card-title">${currentLang === 'ar' ? h.title_ar : h.title_en}</div>
            <div class="card-meta">📅 ${h.date}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideoModal(youtubeId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('videoIframe');
      iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
      modal.style.display = 'flex';
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('videoIframe');
      iframe.src = '';
      modal.style.display = 'none';
    }

    function closeOnBackdrop(e) {
      if (e.target.id === 'videoModal') {
        closeVideoModal();
      }
    }

    function prevMonth() {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    }

    function nextMonth() {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      const t = translations[currentLang];
      const root = document.getElementById('root-html');

      root.setAttribute('lang', currentLang);
      root.setAttribute('dir', t.dir);

      document.getElementById('ui-title').textContent = t.title;
      document.getElementById('ui-subtitle').textContent = t.subtitle;
      document.getElementById('ui-cal-title').textContent = t.calTitle;
      document.getElementById('ui-media-title').textContent = t.mediaTitle;
      document.getElementById('ui-view-all').textContent = t.viewAll;
      document.getElementById('langToggle').textContent = t.langBtn;

      renderTicker();
      renderCalendar();
      renderHighlights();
    }

    // Initial render
    renderTicker();
    renderCalendar();
    renderHighlights();
  </script>
</body>
</html>
